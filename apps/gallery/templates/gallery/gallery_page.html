{% extends "base.html" %}{% load wagtailimages_tags %}
{% block content %}<header class="page-hero"><div class="shell hero-content"><p class="eyebrow">— Parish Gallery</p><h1>{{ page.title }}</h1><p>{{ page.intro }}</p></div></header><div class="shell content-stack"><section class="ministry-grid">{% for item in items %}<figure class="card ministry-card">{% image item.image fill-600x420 format-webp loading="lazy" %}<figcaption><h2>{{ item.title }}</h2>{% if item.captured_at %}<p>{{ item.captured_at }}</p>{% endif %}</figcaption></figure>{% empty %}<div class="card"><h2>Gallery photographs coming soon</h2></div>{% endfor %}</section></div>{% endblock %}
