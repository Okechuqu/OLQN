{% extends "base.html" %}{% load wagtailcore_tags %}
{% block content %}<header class="page-hero"><div class="shell hero-content"><p class="eyebrow">— Search</p><h1>Search OLQN</h1><form class="newsletter-form" method="get"><input type="search" name="q" value="{{ query }}" placeholder="Search parish pages" required><button class="button button-primary">Search</button></form></div></header><div class="shell content-stack">{% for result in results %}<a class="card" href="{% pageurl result %}"><h2>{{ result.title }}</h2><p>{{ result.search_description }}</p></a>{% empty %}{% if query %}<div class="card"><p>No results found for “{{ query }}”.</p></div>{% endif %}{% endfor %}</div>{% endblock %}
