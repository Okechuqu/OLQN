{% load static wagtailcore_tags wagtailimages_tags %}
<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#04377c">
  <title>{% block title %}{{ page.seo_title|default:page.title|default:"OLQN Pro-Cathedral" }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Our Lady Queen of Nigeria Catholic Pro-Cathedral, Garki, Abuja.{% endblock %}">
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <a href="#main" class="skip-link">Skip to content</a>
  {% include "includes/header.html" %}
  <main id="main">{% block content %}{% endblock %}</main>
  {% include "includes/footer.html" %}
</body>
</html>
